<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 5 Final Project</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/1ce2ca0a57.js"
      crossorigin="anonymous"
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="app">
      <div class="navbar">
        <div class="content-wrapper">
          <div class="logo-wrapper">
            <h1 class="logo">Movie API</h1>
          </div>
          <ul class="links">
            <li></li><a href="#" class="link">Home</a></li>
            <li><a href="#" class="link">Find A Movie</a></li>
            <li><a href="#" class="btn-contact">Contact</a></li>
          </ul>
          <button class="btn__menu" onclick="openMenu()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
              <i class="fas fa-times"></i>
            </button>
            <ul class="menu__links">
              <li class="menu__list">
                <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
              </li>
              <li class="menu__list">
                <a href="#features" class="menu__link" onclick="closeMenu()"
                  >Movies</a
                >
              </li>
              <li class="menu__list">
                <a class="menu__link no-cursor" onclick="closeMenu()"
                  >Contacts</a
                >
              </li>
            </ul>
          </div>
        </div>
        <div class="content-wrapper--two">
          <h1 class="headline">Browse Movies</h1>
          <div class="input-wrap">
            <input type="text" placeholder="Search For Movies" onchange="onSearchChange(event)" />
            <div class="search-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
          </div>
        </div>
      </div>
      <section id="search">
        <div id="filter" class="content-wrapper">
          <h1 class="search-info">
            <span class="black-txt">Search results:</span>
          </h1>
          <select name="" id="filter" onchange="filterByLetter(event)">
            <option value="">Sort</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="G">G</option>
            <option value="H">H</option>
            <option value="I">I</option>
            <option value="J">J</option>
            <option value="K">K</option>
            <option value="L">L</option>
            <option value="M">M</option>
            <option value="N">N</option>
            <option value="O">O</option>
            <option value="P">P</option>
            <option value="Q">Q</option>
            <option value="R">R</option>
            <option value="S">S</option>
            <option value="T">T</option>
            <option value="U">U</option>
            <option value="V">V</option>
            <option value="W">W</option>
            <option value="X">X</option>
            <option value="Y">Y</option>
            <option value="Z">Z</option>
          </select>
        </div>
        <div class="loading-state">
         <i class="fa-solid fa-spinner movie__loading--spinner"></i>
        </div>
        <div class="movie-list">
          <div class="movie"></div>
          <div class="content-wrapper">
          </div>
        </div>
      </section>
    </div>
    <footer>
      <div class="row footer__row">
        <a href="#" class="footer__anchor">
          <span class="footer__logo--popper">
            Top
            <i class="fas fa-arrow-up"></i>
          </span>
        </a>
        <div class="footer__social--list">
          <a href="" target="_blank" class="footer__social--link link__hover-effect link__hover-effect--white" target="_blank">Github</a>
          <a href="" target="_blank" class="footer__social--link link__hover-effect link__hover-effect--white" target="_blank">LinkedIn</a>
          <a href="mailto:j.ttipton@yahoo.com" target="_blank" class="footer__social--link link__hover-effect link__hover-effect--white" target="_blank">Email</a>
          <a href="" target="_blank" class="footer__social--link link__hover-effect link__hover-effect--white" target="_blank" download>Resume</a>
        </div>
          <div class="footer__copyright">Copyright © 2026 Justin Tipton</div>
      </div>
    </footer>
  </body>
</html>
