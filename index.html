<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 5 Final Project</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/1ce2ca0a57.js"
      crossorigin="anonymous"
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="app">
      <div class="navbar">
        <div class="content-wrapper">
          <div class="logo-wrapper">
            <h1 class="logo">Movie API</h1>
          </div>
          <ul class="links">
            <li></li><a href="#" class="link">Home</a></li>
            <li><a href="#" class="link">Find A Movie</a></li>
            <li><a href="#" class="btn-contact">Contact</a></li>
          </ul>
          <button class="btn__menu" onclick="openMenu()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
              <i class="fas fa-times"></i>
            </button>
            <ul class="menu__links">
              <li class="menu__list">
                <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
              </li>
              <li class="menu__list">
                <a href="#features" class="menu__link" onclick="closeMenu()"
                  >Movies</a
                >
              </li>
              <li class="menu__list">
                <a class="menu__link no-cursor" onclick="closeMenu()"
                  >Contacts</a
                >
              </li>
            </ul>
          </div>
        </div>
        <div class="content-wrapper--two">
          <h1 class="headline">Browse Movies</h1>
          <div class="input-wrap">
            <input type="text" placeholder="Search For Movies" />
            <div class="search-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
          </div>
        </div>
      </div>
      <section id="search">
        <div id="filter" class="content-wrapper">
          <h1 class="search-info">
            <span class="black-txt">Search results:</span>
          </h1>
        </div>
        <div class="movie-list">
          <div class="movie"></div>
          <div class="content-wrapper">
            <div class="loading-state">
              <i class="fa-solid fa-spinner"></i>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
